theme = "auto"
mode = "auto"
vcs = "git"
watch = true
exclude_untracked = false
line_numbers = true
tab_width = 4
wrap_lines = false
hunk_headers = true
menu_bar = true
agent_notes = true
transparent_background = false

[keybindings]
"hunk.review.nextHunk" = ["n"]
"hunk.review.previousHunk" = ["p"]
