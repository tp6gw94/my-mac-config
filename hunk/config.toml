theme = "github-light-default"
mode = "stack"
vcs = "git"
watch = true
exclude_untracked = false
line_numbers = true
tab_width = 4
wrap_lines = true
hunk_headers = true
menu_bar = true
agent_notes = true
transparent_background = false
copy_decorations = true
cursor_line = "row"

[keybindings]
"hunk.review.nextHunk" = ["n"]
"hunk.review.previousHunk" = ["p"]
